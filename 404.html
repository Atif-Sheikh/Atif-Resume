<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Muhammad Atif</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#070708">
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="assets/profile.jpeg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#070708;color:#f2efea;
            font-family:'Satoshi',sans-serif;
            min-height:100dvh;display:flex;align-items:center;justify-content:center;
            text-align:center;padding:2rem;position:relative;overflow:hidden;
        }
        .glow{
            position:absolute;width:600px;height:600px;border-radius:50%;
            background:radial-gradient(circle,rgba(255,107,43,.14),transparent 68%);
            top:-180px;right:-140px;pointer-events:none;
        }
        .code{
            font-family:'Clash Display',sans-serif;font-weight:700;
            font-size:clamp(5rem,20vw,11rem);line-height:1;letter-spacing:-.04em;
            color:transparent;-webkit-text-stroke:1.5px rgba(242,239,234,.5);
        }
        h1{
            font-family:'Clash Display',sans-serif;font-weight:600;
            font-size:clamp(1.5rem,4vw,2.4rem);letter-spacing:-.02em;margin:1rem 0 .8rem;
        }
        h1 em{font-style:normal;color:#ff6b2b}
        p{color:#9b968e;max-width:44ch;margin:0 auto 2.4rem}
        .btn{
            display:inline-flex;align-items:center;gap:.6rem;
            padding:1rem 2rem;border-radius:100px;font-weight:700;font-size:.95rem;
            text-decoration:none;color:#14080a;
            background:linear-gradient(100deg,#ff6b2b,#ffb02e);
            box-shadow:0 8px 36px rgba(255,107,43,.35);
            transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease;
        }
        .btn:hover{transform:translateY(-2px);box-shadow:0 12px 48px rgba(255,107,43,.45)}
        @media (prefers-reduced-motion:reduce){.btn{transition:none}}
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <main>
        <div class="code" aria-hidden="true">404</div>
        <h1>This page took a <em>wrong turn</em>.</h1>
        <p>The page you're looking for doesn't exist or has moved. Let's get you back to the work.</p>
        <a href="/" class="btn">Back to portfolio &rarr;</a>
    </main>
</body>
</html>
